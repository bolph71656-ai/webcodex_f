name: Japanese RDC Windows installer build

on:
  push:
    branches:
      - release-artifacts/ja-v0.4.1-rdc

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: "0.4.1"
  SOURCE_SHA: "6934623b1609368958e3ef3a1da480d080495c4b"
  WEBCODEX_BUILT_AT: "1789643091"
  WEBCODEX_RELEASE_VERSION: "0.4.1"
  RUST_TARGET: "x86_64-pc-windows-msvc"
  DESKTOP_INSTALLER_NAME: "webcodex-desktop-v0.4.1-ja-rdc-candidate-win32-x64-setup.exe"

jobs:
  windows-x64-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) {
            throw "checkout SHA mismatch: $actual (expected $env:SOURCE_SHA)"
          }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) {
            throw "checkout is not clean"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ja-rdc-installer-win32-x64
          cache-on-failure: true

      - name: Test and build Desktop frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm --prefix apps/desktop run typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed" }
          npm --prefix apps/desktop test
          if ($LASTEXITCODE -ne 0) { throw "frontend tests failed" }
          npm --prefix apps/desktop run build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }

      - name: Build Windows runtime binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --target $env:RUST_TARGET -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          $shortCommit = $env:SOURCE_SHA.Substring(0, 12)
          foreach ($name in @("webcodex", "webcodex-server", "webcodex-runner")) {
            $binary = Join-Path $binDir "$name.exe"
            if (-not (Test-Path $binary)) { throw "missing $binary" }
            $output = (& $binary --version | Select-Object -First 1).TrimEnd()
            $expected = "$name $env:VERSION (commit $shortCommit, dirty=false, built_at=$env:WEBCODEX_BUILT_AT)"
            if ($output -ne $expected) {
              throw "unexpected identity: $output (expected $expected)"
            }
          }

      - name: Stage Desktop runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binDir = Join-Path "target" (Join-Path $env:RUST_TARGET "release")
          $stage = Join-Path $env:RUNNER_TEMP "webcodex-desktop-ja-rdc-win32-x64-bundle"
          & .\scripts\prepare_desktop_bundle.ps1 `
            -BinDir $binDir `
            -Version $env:VERSION `
            -SourceSha $env:SOURCE_SHA `
            -BuiltAt ([Int64]$env:WEBCODEX_BUILT_AT) `
            -OutputDir $stage
          if ($LASTEXITCODE -ne 0) { throw "desktop staging failed" }
          "DESKTOP_TAURI_CONFIG=$(Join-Path $stage 'tauri.bundle.conf.json')" >> $env:GITHUB_ENV
          "DESKTOP_TAURI_TARGET=$(Join-Path $env:GITHUB_WORKSPACE 'target\desktop-ja-rdc-win32-x64-tauri')" >> $env:GITHUB_ENV

      - name: Build Windows Desktop NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CARGO_TARGET_DIR = $env:DESKTOP_TAURI_TARGET
          node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config $env:DESKTOP_TAURI_CONFIG --ci --no-sign -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS build failed" }

          $bundleDir = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $built = @(Get-ChildItem -LiteralPath $bundleDir -Filter "*-setup.exe" -File)
          if ($built.Count -ne 1) {
            throw "expected one NSIS installer, found $($built.Count)"
          }

          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $installer = Join-Path $dist $env:DESKTOP_INSTALLER_NAME
          Copy-Item -LiteralPath $built[0].FullName -Destination $installer

          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = "$hash  $env:DESKTOP_INSTALLER_NAME"
          [System.IO.File]::WriteAllText("$installer.sha256", "$line`n", [System.Text.Encoding]::ASCII)
          [System.IO.File]::WriteAllText((Join-Path $dist "SHA256SUMS"), "$line`n", [System.Text.Encoding]::ASCII)

      - name: Upload Japanese RDC Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: webcodex-desktop-v0.4.1-ja-rdc-win32-x64-release-candidate
          path: |
            dist/webcodex-desktop-v0.4.1-ja-rdc-candidate-win32-x64-setup.exe
            dist/webcodex-desktop-v0.4.1-ja-rdc-candidate-win32-x64-setup.exe.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
